[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gostdoc-engine"
version = "0.1.0"
description = "Проверка и оформление DOCX по ГОСТ"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.2", "lxml", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["gostdoc_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
